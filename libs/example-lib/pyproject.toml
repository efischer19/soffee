[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "example-lib"
version = "0.1.0"
description = "Example shared library demonstrating the monorepo library pattern"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "{{GITHUB_OWNER}}"}
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15,<0.17",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build.targets.wheel]
packages = ["example_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
